services:
  - type: web
    name: rentease-backend
    env: node
    rootDir: Backend
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: rentease-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app  # ← Vercel deploy ke baad apna URL daalo

databases:
  - name: rentease-db
    databaseName: rentease
    user: rentease_user
    plan: free
